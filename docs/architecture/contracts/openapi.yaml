openapi: 3.1.0
info:
  title: Zühlke Car Finder API
  version: 0.3.0
  description: |
    REST API for Zühlke Car Finder. Conventions: see docs/architecture/ADR-0002-api-conventions.md.
    - Business resources live under /api/v1. Operational endpoints (health) are also served
      unversioned under /api.
    - All responses are application/json; charset=utf-8.
    - Every non-2xx response uses the ErrorResponse envelope. Messages are static strings and
      never contain stack traces, file paths or framework/library names.
    - The browser reaches the API same-origin via a reverse proxy. CORS is closed by default
      (ADR-0006 section 6): with CORS_ALLOWED_ORIGINS empty, no Access-Control-* header is ever
      sent. With an allow-list, a request whose Origin exactly matches an entry gets
      `Access-Control-Allow-Origin: <that origin>` (never `*`) +
      `Access-Control-Allow-Credentials: true` + `Vary: Origin`; a preflight (OPTIONS with
      Access-Control-Request-Method) from an allowed origin gets 204 with
      `Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE`,
      `Access-Control-Allow-Headers: Content-Type, X-Requested-With`, `Access-Control-Max-Age: 600`.
      A preflight from any other origin falls through to 404 without CORS headers.
    - Security headers (ADR-0006 section 3) on EVERY response incl. 4xx/429/500 and preflights:
      `Content-Security-Policy: default-src 'none';frame-ancestors 'none';base-uri 'none';form-action 'none'`,
      `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, plus helmet defaults
      (X-Frame-Options, Cross-Origin-Opener-Policy, Cross-Origin-Resource-Policy, ...).
      No `X-Powered-By`, no `Strict-Transport-Security` (HSTS belongs to the TLS terminator).
    - Rate limiting (ADR-0006 section 4), in-memory, fixed window RATE_LIMIT_WINDOW_MINUTES (15):
      * per client IP: every POST register + login, shared across /api/v1/auth and /api/auth,
        max RATE_LIMIT_AUTH_IP_MAX (20); checked before body validation;
      * per normalised email on login: max RATE_LIMIT_LOGIN_EMAIL_MAX (10) attempts not followed
        by a success; checked after body validation and BEFORE any password verification;
        a successful login resets only that email's counter.
      Rejected requests get 429 TOO_MANY_REQUESTS with `Retry-After: <seconds>` and are not counted.
      Client IP = socket address unless TRUST_PROXY=n (n trusted hops in X-Forwarded-For).
    - Authentication (ADR-0005): server-side session referenced by the httpOnly cookie
      `cf_session` (Path=/api, SameSite=Strict, Secure when COOKIE_SECURE=true). The token
      never appears in a response body.
    - CSRF: every POST/PUT/PATCH/DELETE under /api/v1 and /api/auth MUST send the header
      `X-Requested-With: XMLHttpRequest`, otherwise 403 FORBIDDEN "CSRF check failed".
      This check runs after JSON parsing (malformed JSON -> 400 first) and before routing.
    - Auth endpoints are served at /api/v1/auth/* (canonical, used by the frontend) and at the
      identical alias /api/auth/*.
    - Auth responses carry `Cache-Control: no-store`.
servers:
  - url: http://localhost:8080
    description: Docker Compose (nginx proxies /api to the backend)
  - url: http://localhost:3000
    description: Backend directly
tags:
  - name: ops
    description: Operational endpoints
  - name: auth
    description: Registration, login, logout, current user (ADR-0005)
paths:
  /api/health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/health:
    get:
      tags: [ops]
      operationId: getHealthV1
      summary: Liveness check (versioned alias, identical to /api/health)
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/register:
    $ref: "#/components/pathItems/AuthRegister"
  /api/auth/register:
    $ref: "#/components/pathItems/AuthRegister"
  /api/v1/auth/login:
    $ref: "#/components/pathItems/AuthLogin"
  /api/auth/login:
    $ref: "#/components/pathItems/AuthLogin"
  /api/v1/auth/logout:
    $ref: "#/components/pathItems/AuthLogout"
  /api/auth/logout:
    $ref: "#/components/pathItems/AuthLogout"
  /api/v1/auth/me:
    $ref: "#/components/pathItems/AuthMe"
  /api/auth/me:
    $ref: "#/components/pathItems/AuthMe"
  /api/{unknownPath}:
    description: |
      Documentation-only entry: ANY method on ANY path not defined in this contract
      (under /api or elsewhere on the backend) returns 404 with the ErrorResponse envelope.
    get:
      tags: [ops]
      operationId: unknownRoute
      summary: Unknown route (any method)
      security: []
      parameters:
        - name: unknownPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cf_session
      description: |
        Opaque session token (43 base64url chars) set by register/login. HttpOnly,
        SameSite=Strict, Path=/api, Max-Age = SESSION_TTL_HOURS*3600, Secure if COOKIE_SECURE.
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard. Required on every unsafe method under /api/v1 and /api/auth.
      schema:
        type: string
        const: XMLHttpRequest
  headers:
    RetryAfter:
      description: Integer number of seconds (>= 1) until the rate-limit window for the rejecting key resets.
      schema:
        type: integer
        minimum: 1
    SetSessionCookie:
      description: |
        `cf_session=<token>; Max-Age=<ttl seconds>; Path=/api; Expires=<date>; HttpOnly; SameSite=Strict[; Secure]`
      schema:
        type: string
    ClearSessionCookie:
      description: |
        Clears the cookie: `cf_session=; Path=/api; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict[; Secure]`
      schema:
        type: string
    CacheControlNoStore:
      description: Auth responses must not be cached.
      schema:
        type: string
        const: no-store
  pathItems:
    AuthRegister:
      post:
        tags: [auth]
        operationId: register
        summary: Create an account and start a session
        description: |
          Normalises email (trim + lower-case) before the uniqueness check and storage. Stores a
          salted scrypt hash, never the plaintext. On success the user is logged in (Set-Cookie).
          (The /api/auth/register alias shares this definition.)
        security: []
        parameters:
          - $ref: "#/components/parameters/XRequestedWith"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterRequest"
              example:
                email: "  Jane.Doe@Example.com "
                name: Jane Doe
                password: correct-horse-battery
        responses:
          "201":
            description: User created and logged in
            headers:
              Set-Cookie:
                $ref: "#/components/headers/SetSessionCookie"
              Cache-Control:
                $ref: "#/components/headers/CacheControlNoStore"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UserResponse"
                example:
                  user:
                    id: 0b6f1f0e-8a3c-4c47-9b51-2f0f4d1f9e2a
                    email: jane.doe@example.com
                    name: Jane Doe
                    createdAt: "2026-10-19T12:00:00.000Z"
          "400":
            $ref: "#/components/responses/ValidationError"
          "403":
            $ref: "#/components/responses/CsrfForbidden"
          "409":
            description: Email already registered (case-insensitive). No user is created.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
                example:
                  error:
                    code: CONFLICT
                    message: Email is already registered
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
          "429":
            $ref: "#/components/responses/TooManyRequests"
          "500":
            $ref: "#/components/responses/InternalError"
    AuthLogin:
      post:
        tags: [auth]
        operationId: login
        summary: Log in with email and password
        description: |
          Email is normalised before lookup. Unknown email and wrong password return the
          identical 401 (and comparable timing). Any session presented in the request is
          discarded and a new one is issued.
        security: []
        parameters:
          - $ref: "#/components/parameters/XRequestedWith"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
              example:
                email: jane.doe@example.com
                password: correct-horse-battery
        responses:
          "200":
            description: Logged in
            headers:
              Set-Cookie:
                $ref: "#/components/headers/SetSessionCookie"
              Cache-Control:
                $ref: "#/components/headers/CacheControlNoStore"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UserResponse"
          "400":
            $ref: "#/components/responses/ValidationError"
          "401":
            description: Invalid credentials (generic; does not reveal whether the email exists)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Invalid email or password
          "403":
            $ref: "#/components/responses/CsrfForbidden"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
          "429":
            $ref: "#/components/responses/TooManyRequests"
          "500":
            $ref: "#/components/responses/InternalError"
    AuthLogout:
      post:
        tags: [auth]
        operationId: logout
        summary: End the current session (idempotent)
        description: |
          Deletes the server-side session referenced by the cookie (if any) and clears the
          cookie. No authentication required; always 204 when the CSRF header is present.
          No request body is required.
        security: []
        parameters:
          - $ref: "#/components/parameters/XRequestedWith"
        responses:
          "204":
            description: Logged out (no body)
            headers:
              Set-Cookie:
                $ref: "#/components/headers/ClearSessionCookie"
              Cache-Control:
                $ref: "#/components/headers/CacheControlNoStore"
          "403":
            $ref: "#/components/responses/CsrfForbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    AuthMe:
      get:
        tags: [auth]
        operationId: getCurrentUser
        summary: Current authenticated user
        security:
          - sessionCookie: []
        responses:
          "200":
            description: The logged-in user
            headers:
              Cache-Control:
                $ref: "#/components/headers/CacheControlNoStore"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UserResponse"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "500":
            $ref: "#/components/responses/InternalError"
  schemas:
    RegisterRequest:
      type: object
      required: [email, name, password]
      description: Unknown properties are ignored.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased by the server before validation/storage.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must be non-empty after trimming.
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: Not trimmed. No composition rules.
    LoginRequest:
      type: object
      required: [email, password]
      description: Both must be non-empty strings; no format/length validation (wrong values give 401).
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, email, name, createdAt]
      additionalProperties: false
      description: Public user representation. Never contains password, hash or session token.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Normalised (lower-case) email.
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable code (UPPER_SNAKE_CASE).
              enum:
                - BAD_REQUEST
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - TOO_MANY_REQUESTS
                - INTERNAL_ERROR
            message:
              type: string
              description: Short static human-readable message.
            details:
              type: array
              description: Present only for VALIDATION_ERROR.
              items:
                type: object
                required: [path, message]
                additionalProperties: false
                properties:
                  path:
                    type: string
                  message:
                    type: string
  responses:
    TooManyRequests:
      description: |
        Rate limit exceeded (per client IP for register/login, or per email for login). The request
        was rejected before body-dependent work (per IP) or before any password hashing/verification
        (per email) and was not counted. Identical body for both limiters and for existing and
        unknown emails. Auth routes still send Cache-Control: no-store.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Too many requests, please try again later
    ValidationError:
      description: |
        Field-level validation failure. `details` holds at most one entry per invalid field,
        ordered email, name, password; `path` is the field name; messages are static
        (see ADR-0005 section 3). No user or session is created. A syntactically malformed
        JSON body instead yields 400 BAD_REQUEST "Malformed JSON body" (ADR-0002).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - path: email
                  message: Must be a valid email address
                - path: password
                  message: Must be at least 10 characters
    Unauthorized:
      description: Missing, malformed, unknown or expired session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    CsrfForbidden:
      description: "Unsafe method without header X-Requested-With: XMLHttpRequest"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: CSRF check failed
    BadRequest:
      description: Malformed request (e.g. invalid JSON body)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: Malformed JSON body
    NotFound:
      description: Route or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Route not found
    PayloadTooLarge:
      description: Request body exceeds 100 kB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body too large
    InternalError:
      description: Unexpected server error (details logged server-side only)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
